<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card RPG: Fantasía Oscura</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a7c59">
</head>
<body>
  <div class="game-shell">
    
    <!-- FONDO ESTILO PRADERA (CARD GUARDIANS) -->
    <div class="meadow-bg"></div>

    <!-- BANNER DE NOTIFICACIONES -->
    <div id="game-toast" class="toast-banner hidden">
      <span id="toast-text">¡Turno del enemigo!</span>
    </div>

    <!-- ESCENARIO DE COMBATE -->
    <main class="battle-arena">
      <!-- ENEMIGO CON SALUD ARRIBA -->
      <div class="enemy-container">
        <div class="enemy-hp-floating">
          <span class="enemy-name" id="enemy-name">Espíritu Oscuro</span>
          <div class="hp-bar enemy">
            <div class="hp-fill enemy" id="enemy-hp-fill" style="width: 100%;"></div>
          </div>
          <small><span id="enemy-hp">60</span> / 60 HP</small>
        </div>

        <!-- BURBUJA DE INTENCIÓN -->
        <div class="speech-bubble" id="enemy-intent-bubble">
          <i class="fa-solid fa-claw-marks intent-icon"></i>
          <span id="enemy-intent-val">12</span>
        </div>

        <!-- SPRITE DEL MONSTRUO -->
        <div class="monster-wrapper">
          <img id="monster-sprite" src="https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/other/official-artwork/92.png" alt="Enemigo" class="monster-img">
          <div class="shadow-platform"></div>
        </div>
      </div>

      <!-- ESTADÍSTICAS DEL HÉROE UBICADAS ABAJO (SOBRE LAS CARTAS) -->
      <div class="hero-stats-row">
        <div class="hero-avatar">
          <i class="fa-solid fa-helmet-safety"></i>
        </div>
        <div class="hero-hp-container">
          <div class="hp-bar hero">
            <div class="hp-fill hero" id="player-hp-fill" style="width: 100%;"></div>
          </div>
          <small><span id="player-hp">80</span> / 80 HP</small>
        </div>
        <div class="hero-armor-badge">
          <i class="fa-solid fa-shield-halved"></i> <span id="player-armor">0</span>
        </div>
      </div>
    </main>

    <!-- PIE DE PÁGINA Y CARTAS -->
    <footer class="battle-footer">
      <div class="player-hud-row">
        <div class="deck-pile" title="Mazo">
          <i class="fa-solid fa-layer-group"></i> <span id="deck-count">0</span>
        </div>

        <div class="energy-orb">
          <span id="player-energy">3</span>/<span id="player-max-energy">3</span>
        </div>

        <button class="btn-end-turn" onclick="endTurn()">Listo</button>

        <div class="discard-pile" title="Descarte">
          <i class="fa-solid fa-box-archive"></i> <span id="discard-count">0</span>
        </div>
      </div>

      <div class="cards-hand-container" id="player-hand">
        <!-- Cartas renderizadas -->
      </div>
    </footer>

  </div>

  <script src="app.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>

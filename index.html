<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card RPG: Clon Card Guardians</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a7c59">
</head>
<body>
  <div class="game-shell unified-bg" id="game-shell">
    
    <!-- CUADRÍCULA GUÍA 4X4 (ACTIVABLE) -->
    <div class="grid-guide-4x4 hidden" id="grid-guide">
      <div class="grid-cell">1,1</div><div class="grid-cell">1,2</div><div class="grid-cell">1,3</div><div class="grid-cell">1,4</div>
      <div class="grid-cell">2,1</div><div class="grid-cell">2,2</div><div class="grid-cell">2,3</div><div class="grid-cell">2,4</div>
      <div class="grid-cell">3,1</div><div class="grid-cell">3,2</div><div class="grid-cell">3,3</div><div class="grid-cell">3,4</div>
      <div class="grid-cell">4,1</div><div class="grid-cell">4,2</div><div class="grid-cell">4,3</div><div class="grid-cell">4,4</div>
    </div>

    <!-- BOTONES DE HERRAMIENTAS SUPERIORES -->
    <div class="top-tools-bar">
      <button class="tool-btn" onclick="toggleGridGuide()" title="Alternar Cuadrícula Guía">
        <i class="fa-solid fa-border-all"></i>
      </button>
      <button class="tool-btn" onclick="toggleFullScreen()" title="Pantalla Completa">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>

    <!-- BANNER DE NOTIFICACIONES -->
    <div id="game-toast" class="toast-banner hidden">
      <span id="toast-text">¡Notificación!</span>
    </div>

    <!-- ZONA ENEMIGOS (FILAS 1 Y 2) -->
    <section class="top-enemy-zone">
      <div class="enemy-status-floating">
        <span class="enemy-name" id="enemy-name">Cargando...</span>
        <div class="hp-bar enemy">
          <div class="hp-fill enemy" id="enemy-hp-fill" style="width: 100%;"></div>
        </div>
        <small><span id="enemy-hp">60</span> / <span id="enemy-max-hp">60</span> HP</small>
      </div>

      <div class="intent-bubble-interactive" onclick="inspectIntent()">
        <i class="fa-solid fa-sword intent-icon"></i>
        <span id="enemy-intent-val">12</span>
      </div>

      <div class="monster-wrapper">
        <img id="monster-sprite" src="" alt="Enemigo" class="monster-img">
        <div class="shadow-platform"></div>
      </div>
    </section>

    <!-- ZONA HÉROE (FILAS 3 Y 4) -->
    <section class="bottom-hero-zone">
      
      <!-- HUD DEL HÉROE -->
      <div class="mid-hero-hud-row">
        <div class="hero-card-guardians-hud">
          <div class="hero-portrait">
            <i class="fa-solid fa-helmet-safety"></i>
          </div>
          <div class="hero-bars">
            <div class="hp-bar hero">
              <div class="hp-fill hero" id="player-hp-fill" style="width: 100%;"></div>
            </div>
            <small><span id="player-hp">80</span> / 80 HP</small>
          </div>
          <div class="hero-armor-badge">
            <i class="fa-solid fa-shield-halved"></i> <span id="player-armor">0</span>
          </div>
        </div>

        <div class="special-attack-orb" id="special-orb" onclick="useSpecialAbility()" title="Ataque Especial">
          <i class="fa-solid fa-fire-flame-curved special-icon"></i>
          <span class="special-count" id="special-charges">0/3</span>
        </div>
      </div>

      <!-- MANO DE CARTAS CON PROPORCIÓN 1:2 -->
      <div class="cards-hand-viewport" id="player-hand"></div>

      <!-- CONTROLES FINALES INFERIORES -->
      <div class="bottom-action-area">
        <div class="piles-energy-row">
          <div class="deck-orb-pile" title="Mazo">
            <i class="fa-solid fa-layer-group"></i> <span id="deck-count">0</span>
          </div>

          <div class="energy-orb-centered">
            <span id="player-energy">3</span>/<span id="player-max-energy">3</span>
          </div>

          <button class="btn-ready-lists" onclick="endTurn()">Listo</button>

          <div class="discard-orb-pile" title="Descarte">
            <i class="fa-solid fa-box-archive"></i> <span id="discard-count">0</span>
          </div>
        </div>
      </div>

    </section>

  </div>

  <script src="app.js?v=10"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card RPG: Fantasía Oscura</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161214">
</head>
<body>
  <div class="game-shell">
    
    <!-- FONDO ILUSTRADO DE MAZMORRA -->
    <div class="dungeon-bg"></div>

    <!-- BANNER NOTIFICADOR (REEMPLAZO DE ALERT) -->
    <div id="game-toast" class="toast-banner hidden">
      <span id="toast-text">¡Turno del enemigo!</span>
    </div>

    <!-- CABECERA DEL COMBATE -->
    <header class="battle-header">
      <div class="entity-status player-status">
        <div class="avatar-frame">
          <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=100&h=100&fit=crop" alt="Héroe" class="avatar-img">
        </div>
        <div class="bar-container">
          <span class="status-name">Héroe</span>
          <div class="hp-bar"><div class="hp-fill" id="player-hp-fill" style="width: 100%;"></div></div>
          <small><span id="player-hp">80</span> / 80 HP</small>
        </div>
      </div>

      <div class="dungeon-info">
        <span class="act-label">ACTO I</span>
        <h3 class="node-title">Catacumbas</h3>
      </div>

      <div class="entity-status enemy-status">
        <div class="bar-container text-right">
          <span class="status-name" id="enemy-name">Golem de Piedra</span>
          <div class="hp-bar enemy"><div class="hp-fill enemy" id="enemy-hp-fill" style="width: 100%;"></div></div>
          <small><span id="enemy-hp">60</span> / 60 HP</small>
        </div>
        <div class="avatar-frame enemy">
          <img id="enemy-avatar-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&h=100&fit=crop" alt="Enemigo" class="avatar-img">
        </div>
      </div>
    </header>

    <!-- ÁREA CENTRAL DE COMBATE (ESCENARIO) -->
    <main class="battle-arena">
      <!-- ESCENARIO DEL ENEMIGO -->
      <div class="enemy-stage-visual">
        <!-- Burbuja de Intención estilo Card Guardians -->
        <div class="speech-bubble" id="enemy-intent-bubble">
          <span class="intent-icon">⚔️</span> <span id="enemy-intent-val">12</span>
        </div>

        <div class="monster-wrapper">
          <img id="monster-sprite" src="https://cdn-icons-png.flaticon.com/512/3408/3408506.png" alt="Monstruo" class="monster-img">
          <div class="shadow-platform"></div>
        </div>
      </div>
    </main>

    <!-- PIE DE PÁGINA Y MANO DE CARTAS -->
    <footer class="battle-footer">
      <div class="player-hud-row">
        <div class="deck-pile" title="Mazo de Robo">
          🎴 <span id="deck-count">0</span>
        </div>

        <div class="energy-orb">
          <span id="player-energy">3</span>/<span id="player-max-energy">3</span> ⚡
        </div>

        <div class="discard-pile" title="Descarte">
          🪦 <span id="discard-count">0</span>
        </div>

        <button class="btn-end-turn" onclick="endTurn()">Terminar Turno</button>
      </div>

      <div class="cards-hand-container" id="player-hand">
        <!-- Cartas renderizadas por JavaScript -->
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
